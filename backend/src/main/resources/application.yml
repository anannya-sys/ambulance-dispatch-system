server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: goldenhour-dispatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goldenhour}
    username: ${DB_USERNAME:goldenhour}
    password: ${DB_PASSWORD:goldenhour}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        linger.ms: 5
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JSON is read as text and parsed by the listener with Jackson: explicit and easy to debug
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  task:
    scheduling:
      pool:
        size: 6
  jackson:
    serialization:
      write-dates-as-timestamps: false

goldenhour:
  fleet-size: 50
  ack-timeout-seconds: 30
  candidate-ambulances: 8
  live:
    enabled: ${LIVE_ENABLED:true}
    speed: ${SIM_SPEED:8}               # simulated seconds per real second
    auto-calls: true
    calls-per-day: 500
    pre-positioning: true
    green-corridor: true
    no-ack-probability: 0.04
    breakdown-probability: 0.01

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: goldenhour

springdoc:
  swagger-ui:
    path: /swagger-ui.html
